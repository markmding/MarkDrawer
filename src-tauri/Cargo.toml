[package]
name = "mark-drawer"
version = "0.7.1"
description = "Mark Drawer 文屉 — a local-first Markdown drawer"
authors = ["MARK <MARK#EZVE.COM>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mark_drawer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
ignore = "0.4"
base64 = "0.22"
tantivy = "0.22"
thiserror = "2"
encoding_rs = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
